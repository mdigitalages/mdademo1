<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Update - mdigitalages.my</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #ffffff;
            --bg-alt: #f8f8f8;
            --text-primary: #000000;
            --text-secondary: #333333;
            --text-muted: #888888;
            --dark: #000000;
            --gray-dark: #222222;
            --gray-mid: #555555;
            --gray-light: #aaaaaa;
            --glow-dark: 0 0 10px rgba(0, 0, 0, 0.3), 0 0 20px rgba(0, 0, 0, 0.2);
            --glow-light: 0 0 10px rgba(255, 255, 255, 0.8), 0 0 20px rgba(255, 255, 255, 0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            font-family: 'Orbitron', sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            overflow-x: hidden;
            position: relative;
        }

        /* Scan lines overlay */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.015),
                rgba(0, 0, 0, 0.015) 1px,
                transparent 1px,
                transparent 2px
            );
            pointer-events: none;
            z-index: 1000;
        }

        /* Subtle gradient background */
        .bg-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(ellipse at 0% 0%, rgba(0, 0, 0, 0.03) 0%, transparent 50%),
                radial-gradient(ellipse at 100% 100%, rgba(0, 0, 0, 0.05) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(0, 0, 0, 0.02) 0%, transparent 70%);
            z-index: 0;
        }

        /* Grid pattern */
        .grid-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(0, 0, 0, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 0, 0, 0.04) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: 1;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-alt);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--neon-cyan);
            border-radius: 4px;
            box-shadow: var(--glow-cyan);
        }

        /* Geometric Decorations - Neon style */
        .decoration {
            position: fixed;
            pointer-events: none;
            z-index: 2;
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            opacity: 0.6;
        }

        .deco-1 { top: 15%; left: 8%; transform: rotate(-15deg); color: var(--gray-light); }
        .deco-2 { top: 25%; right: 12%; transform: rotate(10deg); color: var(--gray-mid); }
        .deco-3 { top: 60%; left: 5%; transform: rotate(5deg); color: var(--gray-light); }
        .deco-4 { top: 70%; right: 8%; transform: rotate(-8deg); color: var(--gray-mid); }
        .deco-5 { bottom: 20%; left: 15%; transform: rotate(12deg); color: var(--gray-light); }
        .deco-6 { bottom: 15%; right: 18%; transform: rotate(-5deg); color: var(--gray-mid); }

        .deco-shape {
            position: fixed;
            pointer-events: none;
            z-index: 2;
        }

        .shape-1 {
            top: 20%;
            left: 3%;
            width: 40px;
            height: 2px;
            background: linear-gradient(90deg, var(--dark), var(--gray-light));
            transform: rotate(45deg);
        }

        .shape-2 {
            top: 35%;
            right: 5%;
            width: 30px;
            height: 30px;
            border: 2px solid var(--gray-mid);
            border-radius: 50%;
            animation: pulse-shape 2s ease-in-out infinite;
        }

        .shape-3 {
            bottom: 30%;
            left: 8%;
            width: 20px;
            height: 20px;
            border: 2px solid var(--dark);
            animation: pulse-rotate 2.5s ease-in-out infinite;
        }

        .shape-4 {
            top: 45%;
            right: 10%;
            width: 2px;
            height: 50px;
            background: linear-gradient(180deg, var(--dark), var(--gray-light));
        }

        .shape-5 {
            bottom: 25%;
            right: 3%;
            width: 35px;
            height: 2px;
            background: linear-gradient(90deg, var(--gray-light), var(--dark));
            transform: rotate(-30deg);
        }

        .shape-6 {
            top: 10%;
            left: 20%;
            width: 8px;
            height: 8px;
            background: var(--dark);
            border-radius: 50%;
            animation: pulse-dot 1.5s ease-in-out infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 0.4; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.2); }
        }

        @keyframes pulse-shape {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.6; }
        }

        @keyframes pulse-rotate {
            0%, 100% { opacity: 0.3; transform: rotate(0deg); }
            50% { opacity: 0.5; transform: rotate(45deg); }
        }

        /* Main Container */
        .container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            position: relative;
            z-index: 10;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 4rem;
        }

        .event-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            color: var(--gray-mid);
            margin-bottom: 1rem;
        }

        h1 {
            font-size: clamp(3rem, 10vw, 7rem);
            font-weight: 800;
            color: var(--text-primary);
            letter-spacing: 0.05em;
            line-height: 1;
            position: relative;
        }

        h1::after {
            content: '';
            position: absolute;
            bottom: -0.1em;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--dark), var(--gray-mid), var(--dark));
        }

        .target-date {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-top: 2rem;
            letter-spacing: 0.1em;
        }

        /* Countdown */
        .countdown {
            display: flex;
            gap: 2rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 4rem;
        }

        .time-block {
            text-align: center;
            position: relative;
            padding: 1.5rem 2rem;
            background: rgba(255, 255, 255, 0.9);
            border: 2px solid var(--gray-light);
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        .time-block::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--dark), transparent);
        }

        .time-block:hover {
            background: rgba(255, 255, 255, 1);
            border-color: var(--dark);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
        }

        .time-value {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(3.5rem, 10vw, 6rem);
            font-weight: 700;
            line-height: 1;
            background: linear-gradient(180deg, var(--dark) 0%, var(--gray-mid) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .time-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: var(--gray-mid);
            margin-top: 1rem;
        }

        .separator {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(2.5rem, 8vw, 4rem);
            color: var(--gray-light);
            align-self: center;
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* Vertical text decoration */
        .vertical-text {
            position: fixed;
            writing-mode: vertical-rl;
            text-orientation: mixed;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
            letter-spacing: 0.4em;
            z-index: 2;
        }

        .vertical-left {
            left: 2rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gray-mid);
        }

        .vertical-right {
            right: 2rem;
            top: 50%;
            transform: translateY(-50%) rotate(180deg);
            color: var(--gray-light);
        }

        /* Footer */
        .footer {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            letter-spacing: 0.2em;
            z-index: 10;
        }

        .footer span {
            color: var(--gray-mid);
            cursor: pointer;
            transition: all 0.3s ease;
            padding: 0.5rem 1rem;
            border: 1px solid transparent;
        }

        .footer span:hover {
            color: var(--dark);
            border-color: var(--dark);
            background: rgba(0, 0, 0, 0.05);
        }

        /* Completion state */
        .completed .time-value {
            background: linear-gradient(180deg, var(--gray-mid) 0%, var(--gray-light) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Corner decorations */
        .corner {
            position: fixed;
            width: 50px;
            height: 50px;
            z-index: 2;
        }

        .corner-tl {
            top: 20px;
            left: 20px;
            border-top: 2px solid var(--dark);
            border-left: 2px solid var(--dark);
        }

        .corner-tr {
            top: 20px;
            right: 20px;
            border-top: 2px solid var(--gray-mid);
            border-right: 2px solid var(--gray-mid);
        }

        .corner-bl {
            bottom: 20px;
            left: 20px;
            border-bottom: 2px solid var(--gray-light);
            border-left: 2px solid var(--gray-light);
        }

        .corner-br {
            bottom: 20px;
            right: 20px;
            border-bottom: 2px solid var(--dark);
            border-right: 2px solid var(--dark);
        }

        /* Responsive - Tablet */
        @media (max-width: 900px) {
            .countdown {
                gap: 1.5rem;
            }

            .time-block {
                padding: 1.25rem 1.75rem;
            }

            .vertical-text {
                font-size: 0.55rem;
                letter-spacing: 0.3em;
            }

            .vertical-left {
                left: 1rem;
            }

            .vertical-right {
                right: 1rem;
            }

            .corner {
                width: 35px;
                height: 35px;
            }
        }

        /* Responsive - Mobile */
        @media (max-width: 768px) {
            .container {
                padding: 1.5rem;
                justify-content: flex-start;
                padding-top: 15vh;
            }

            .header {
                margin-bottom: 2.5rem;
            }

            .event-label {
                font-size: 0.7rem;
                letter-spacing: 0.25em;
            }

            h1 {
                font-size: clamp(2.2rem, 12vw, 4rem);
            }

            h1::after {
                height: 3px;
            }

            .target-date {
                font-size: 0.75rem;
                margin-top: 1.25rem;
            }

            .countdown {
                gap: 0.75rem;
                width: 100%;
                max-width: 400px;
                display: grid;
                grid-template-columns: repeat(2, 1fr);
            }

            .time-block {
                padding: 1.25rem 1rem;
                clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
            }

            .time-value {
                font-size: clamp(2.5rem, 15vw, 3.5rem);
            }

            .time-label {
                font-size: 0.6rem;
                letter-spacing: 0.2em;
                margin-top: 0.75rem;
            }

            .separator {
                display: none;
            }

            .vertical-text {
                display: none;
            }

            .decoration,
            .deco-shape {
                display: none;
            }

            .corner {
                width: 30px;
                height: 30px;
            }

            .corner-tl {
                top: 15px;
                left: 15px;
            }

            .corner-tr {
                top: 15px;
                right: 15px;
            }

            .corner-bl {
                bottom: 15px;
                left: 15px;
            }

            .corner-br {
                bottom: 15px;
                right: 15px;
            }

            .footer {
                bottom: 1.5rem;
            }

            .footer span {
                font-size: 0.65rem;
                padding: 0.4rem 0.8rem;
            }
        }

        /* Responsive - Small Mobile */
        @media (max-width: 480px) {
            .container {
                padding: 1rem;
                padding-top: 12vh;
            }

            .header {
                margin-bottom: 2rem;
            }

            .event-label {
                font-size: 0.6rem;
                letter-spacing: 0.2em;
            }

            h1 {
                font-size: clamp(1.8rem, 11vw, 2.8rem);
            }

            .target-date {
                font-size: 0.65rem;
            }

            .countdown {
                gap: 0.5rem;
                max-width: 320px;
            }

            .time-block {
                padding: 1rem 0.75rem;
            }

            .time-value {
                font-size: clamp(2rem, 12vw, 2.8rem);
            }

            .time-label {
                font-size: 0.55rem;
                letter-spacing: 0.15em;
                margin-top: 0.5rem;
            }

            .corner {
                width: 25px;
                height: 25px;
            }

            .corner-tl, .corner-tr {
                top: 10px;
            }

            .corner-bl, .corner-br {
                bottom: 10px;
            }

            .corner-tl, .corner-bl {
                left: 10px;
            }

            .corner-tr, .corner-br {
                right: 10px;
            }

            .footer {
                bottom: 1rem;
            }

            .footer span {
                font-size: 0.6rem;
            }
        }

        /* Responsive - Very Small */
        @media (max-width: 360px) {
            h1 {
                font-size: 1.6rem;
            }

            .time-value {
                font-size: 1.8rem;
            }

            .countdown {
                gap: 0.4rem;
            }

            .time-block {
                padding: 0.875rem 0.5rem;
            }
        }

        /* Landscape mobile optimization */
        @media (max-height: 500px) and (orientation: landscape) {
            .container {
                padding-top: 5vh;
                justify-content: center;
            }

            .header {
                margin-bottom: 1.5rem;
            }

            h1 {
                font-size: 2.5rem;
            }

            .countdown {
                display: flex;
                flex-wrap: nowrap;
                gap: 1rem;
            }

            .time-block {
                padding: 0.75rem 1rem;
            }

            .time-value {
                font-size: 2rem;
            }

            .corner {
                display: none;
            }
        }

        /* Hidden form */
        .event-form {
            display: none;
        }

        /* Touch-friendly tap targets */
        @media (hover: none) and (pointer: coarse) {
            .footer span {
                min-height: 44px;
                display: flex;
                align-items: center;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="bg-gradient"></div>
    <div class="grid-overlay"></div>

    <!-- Corner decorations -->
    <div class="corner corner-tl"></div>
    <div class="corner corner-tr"></div>
    <div class="corner corner-bl"></div>
    <div class="corner corner-br"></div>

    <!-- Geometric Decorations -->
    <div class="decoration deco-1">◇ ◆ ◇</div>
    <div class="decoration deco-2">// —</div>
    <div class="decoration deco-3">○ ○<br>○ ○</div>
    <div class="decoration deco-4">| |</div>
    <div class="decoration deco-5">— —</div>
    <div class="decoration deco-6">◇<br>◇</div>

    <div class="deco-shape shape-1"></div>
    <div class="deco-shape shape-2"></div>
    <div class="deco-shape shape-3"></div>
    <div class="deco-shape shape-4"></div>
    <div class="deco-shape shape-5"></div>
    <div class="deco-shape shape-6"></div>

    <!-- Vertical Text -->
    <div class="vertical-text vertical-left">MDIGITALAGES.MY</div>
    <div class="vertical-text vertical-right">COMING SOON</div>

    <div class="container">
        <div class="header">
            <p class="event-label" id="eventLabel">Coming Soon</p>
            <h1 id="eventName">New Update</h1>
            <p class="target-date" id="targetDateDisplay">January 5, 2026 • 00:00</p>
        </div>

        <div class="countdown" id="countdown">
            <div class="time-block">
                <div class="time-value" id="days">03</div>
                <div class="time-label">Days</div>
            </div>
            <div class="separator">:</div>
            <div class="time-block">
                <div class="time-value" id="hours">08</div>
                <div class="time-label">Hours</div>
            </div>
            <div class="separator">:</div>
            <div class="time-block">
                <div class="time-value" id="minutes">00</div>
                <div class="time-label">Minutes</div>
            </div>
            <div class="separator">:</div>
            <div class="time-block">
                <div class="time-value" id="seconds">00</div>
                <div class="time-label">Seconds</div>
            </div>
        </div>
    </div>

    <div class="footer">
        <span onclick="window.open('https://mdigitalages.my', '_blank')">[ mdigitalages.my ]</span>
    </div>

    <script>
        // Default target: January 5, 2026 - Website Update
        let targetDate = new Date('2026-01-05T00:00:00');
        let eventName = 'New Update';
        let startDate = new Date();

        // Update display elements
        function updateDisplay() {
            document.getElementById('eventName').textContent = eventName;
            document.getElementById('targetDateDisplay').textContent = 
                targetDate.toLocaleDateString('en-US', { 
                    year: 'numeric', 
                    month: 'long', 
                    day: 'numeric'
                }) + ' • ' + 
                targetDate.toLocaleTimeString('en-US', {
                    hour: '2-digit',
                    minute: '2-digit',
                    hour12: false
                });
        }

        // Update countdown every second
        function updateCountdown() {
            const now = new Date();
            const diff = targetDate - now;

            if (diff <= 0) {
                // Countdown complete
                document.getElementById('days').textContent = '00';
                document.getElementById('hours').textContent = '00';
                document.getElementById('minutes').textContent = '00';
                document.getElementById('seconds').textContent = '00';
                document.getElementById('eventLabel').textContent = '🚀 Update is Live!';
                document.getElementById('countdown').classList.add('completed');
                return;
            }

            document.getElementById('eventLabel').textContent = 'Coming Soon';
            document.getElementById('countdown').classList.remove('completed');

            // Calculate time units
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);

            // Update display
            document.getElementById('days').textContent = String(days).padStart(2, '0');
            document.getElementById('hours').textContent = String(hours).padStart(2, '0');
            document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
            document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');
        }

        // Initialize
        updateDisplay();
        updateCountdown();
        setInterval(updateCountdown, 1000);
    </script>
</body>
</html>
